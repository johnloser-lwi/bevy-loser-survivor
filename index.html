<!doctype html>
<html lang="en">

<head>
  <title>Losers' World: Zombie Survivor</title>
  <link rel="icon" href="icon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    html {
      height: 100%;
    }
    body {
      height: 100%;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      align-content: center;
    }

    canvas {
      aspect-ratio: 16/9;
      height: 100%;
    }

    @media (max-aspect-ratio: 16/9) {
      canvas {
        width: 100%;
        height: auto;
      }
    }

    canvas:focus {
      outline-style: none;
    }
  </style>
</head>

<body>
  <div id="game-container">
    <script type="module">
      import './restart-audio-context.js'
      import init from './loser-survivor.js'

      
      init().catch((error) => {
        if (!error.message.startsWith("Using exceptions for control flow, don't mind me. This isn't actually an error!")) {
          throw error;
        }
      });
    </script>
  </div>
</body>

</html>
